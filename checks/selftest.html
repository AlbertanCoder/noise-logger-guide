<!doctype html><meta charset="utf-8"><title>selftest running</title>
<body style="margin:0;background:#888"><iframe id="f" src="../index.html#model" style="width:390px;height:900px;border:0;background:#fff"></iframe>
<pre id="selftest"></pre>
<script>
/* Used by scripts/check_page.py (added after the final audit, finding FA-17: the word checks passed while the 3D buttons did nothing).
   Opens the real page at phone width (390 px), presses things, measures what is drawn, and writes the numbers into the <pre> above.
   It starts on the 3D tab: a hidden browser only sizes the 3D view when the page opens with it on screen. */
const f = document.getElementById("f"), out = { errors: [], tabs: {} };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
/** the measuring numbers that sit whole inside the 3D picture */
const marksInside = (doc) => { const box = doc.getElementById("viewer").getBoundingClientRect();
  return [...doc.querySelectorAll(".mlabel")].filter((e) => { const r = e.getBoundingClientRect();
    return e.style.display !== "none" && r.width > 0 && r.left >= box.left && r.right <= box.right && r.top >= box.top && r.bottom <= box.bottom; }).map((e) => e.textContent); };

async function run() {
  const d = f.contentDocument, w = f.contentWindow;
  w.addEventListener("error", (e) => out.errors.push(String(e.message)));
  for (let i = 0; i < 120 && d.body.dataset.modelLoaded !== "yes"; i++) await wait(200);
  out.model = d.body.dataset.modelLoaded || "no";
  out.steps = d.querySelectorAll(".step").length;
  out.parts = d.querySelectorAll(".part").length;
  out.bill = (d.getElementById("bill") || {}).textContent || "";
  out.progress = (d.getElementById("progress-text") || {}).textContent || "";
  out.links = [...d.querySelectorAll('a[href^="http"]')].map((a) => ({ href: a.href, newTab: a.target === "_blank" }));

  // ---- the 3D view really changes when its buttons are pressed ----
  // settle = let the clock run, then wait for real drawn frames (a hidden browser fast-forwards timers but draws when it likes)
  const settle = async (ms) => { await wait(ms); for (let i = 0; i < 6; i++) await new Promise((r) => w.requestAnimationFrame(r)); };
  const canvas = d.querySelector("#viewer canvas"), small = document.createElement("canvas"); small.width = small.height = 96;
  const g = small.getContext("2d", { willReadFrequently: true });
  const shot = () => { g.drawImage(canvas, 0, 0, 96, 96); return g.getImageData(0, 0, 96, 96).data; };
  const differ = (a, b) => { let s = 0; for (let i = 0; i < a.length; i += 4) s += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]); return s / (a.length / 4) / 3; };
  const press = (id) => d.getElementById(id).click();
  for (let i = 0; i < 80 && canvas && !(canvas.width > 0 && canvas.height > 0); i++) await settle(100);   // the view sizes itself once its tab is on screen
  out.canvas = canvas ? canvas.width + "x" + canvas.height : "none";
  if (canvas && canvas.width > 0 && out.model === "yes") {
    await settle(400);
    const flat = shot(); let lo = 255, hi = 0; for (let i = 0; i < flat.length; i += 4) { lo = Math.min(lo, flat[i]); hi = Math.max(hi, flat[i]); }
    out.pictureRange = hi - lo;                                   // a blank view has no range
    press("b-measure"); await settle(1800); const through = shot(); // from above, case see-through, measuring lines on the board
    out.measurePressed = d.getElementById("b-xray").getAttribute("aria-pressed") === "true";
    out.measureMarks = marksInside(d);                              // every number tag whole inside the picture (audit of 24 Nov 2026, finding 1)
    press("b-xray"); await settle(700); const solid = shot();       // same view, case solid again
    out.seeInsideChange = Math.round(differ(through, solid) * 10) / 10;
    out.labelsAtStart = w.__view().labels;                          // labels stay hidden until asked for (Shad, 24 Nov 2026)
    out.labelsShownAtStart = [...d.querySelectorAll(".vlabel")].filter((b) => b.style.display !== "none").length;
    press("b-labels");                                              // on: stored, and kept on for the label checks below
    press("b-assembled"); await settle(300); press("b-exploded"); await settle(2500);
    out.explodedPressed = d.getElementById("b-exploded").getAttribute("aria-pressed") === "true";
    const box = d.getElementById("viewer").getBoundingClientRect();
    out.explodedLabels = [...d.querySelectorAll(".vlabel")].filter((b) => { const r = b.getBoundingClientRect();
      return b.style.display !== "none" && r.width > 0 && r.top >= box.top - 1 && r.bottom <= box.bottom + 1; }).map((b) => b.textContent);
    press("b-assembled"); await settle(300);
    const next = d.getElementById("m-next"); for (let i = 0; i < 5; i++) next.click();   // step 5: everything but the card is ghosted
    await settle(1500); const ghosted = shot(); let red = 0;
    for (let i = 0; i < ghosted.length; i += 4) if (ghosted[i] > 140 && ghosted[i + 1] < 90 && ghosted[i + 2] < 120) red++;   // solid case-red
    out.step5Title = d.getElementById("sp-title").textContent;
    out.step5SolidRed = Math.round(1000 * red / (ghosted.length / 4)) / 10;   // % of the picture still solid red: the base must be ghosted here
    out.step5MaxPolar = Math.round(w.__view().maxPolar * 1000) / 1000;      // step 5 looks from below, so it may go under the floor

    // ---- Round 2 (24 Nov 2026): handles like the drone guide ----
    const vw = d.getElementById("viewer"), r0 = canvas.getBoundingClientRect();
    out.viewerH = Math.round(vw.getBoundingClientRect().height);
    out.touchAction = w.getComputedStyle(canvas).touchAction;
    out.hint = (d.getElementById("vhint") || {}).textContent || "";
    out.grabButton = !!d.getElementById("b-grab");
    for (let i = 0; i < 6; i++) d.getElementById("m-back").click();             // back to the overview
    await settle(1500);
    const v0 = w.__view(), still = shot();
    out.overviewMaxPolar = Math.round(v0.maxPolar * 1000) / 1000;
    out.damping = v0.damping;
    const wheel = (dy) => canvas.dispatchEvent(new w.WheelEvent("wheel", { deltaY: dy, clientX: r0.left + r0.width / 2, clientY: r0.top + r0.height / 2, bubbles: true, cancelable: true }));
    out.wheelKeptFromPage = !wheel(-300);                                     // false from dispatchEvent = the page did not scroll
    await settle(300);
    out.wheelZoomChange = Math.round(differ(still, shot()) * 10) / 10;
    out.wheelMoved = w.__view().moved;
    for (let i = 0; i < 40; i++) wheel(-600); await settle(200);
    const vin = w.__view(); out.zoomInStop = Math.round(vin.dist / vin.min * 1000) / 1000;     // 1 = stopped at the near limit
    for (let i = 0; i < 60; i++) wheel(600); await settle(200);
    const vout = w.__view(); out.zoomOutStop = Math.round(vout.dist / vout.max * 1000) / 1000; // 1 = stopped at the far limit
    out.limitsRatio = Math.round(vout.max / vout.min * 100) / 100;                             // 3.2 / 0.25 = 12.8
    press("b-reset"); await settle(1600);
    out.resetBack = Math.round(differ(still, shot()) * 10) / 10;                // close to 0: the same picture as before the wheel
    out.resetDist = Math.round(w.__view().dist / v0.dist * 1000) / 1000;
    press("b-full"); await settle(800);
    const wrap = d.getElementById("vwrap");
    out.fullOpen = wrap.classList.contains("v-overlay") || d.fullscreenElement === wrap;
    out.fullH = Math.round(vw.getBoundingClientRect().height);
    out.fullLabel = d.getElementById("b-full").textContent;
    // a Close button at the top, and everything needed on screen without scrolling (audit of 24 Nov 2026, finding 6)
    const onScreenOrBelow = (id) => { const r = d.getElementById(id).getBoundingClientRect(); return r.width > 0 && r.height > 0; };
    const onScreen = (id) => { const r = d.getElementById(id).getBoundingClientRect(); return r.width > 0 && r.top >= 0 && r.bottom <= w.innerHeight && r.left >= 0 && r.right <= w.innerWidth; };
    out.fullClose = { atTop: onScreen("b-fullclose") && d.getElementById("b-fullclose").getBoundingClientRect().top < 120, play: onScreen("b-play"), next: onScreen("m-next"), folded: d.getElementById("views").open === false,
      scrollsDown: wrap.scrollHeight > wrap.clientHeight + 1, shareOfScreen: Math.round(100 * vw.getBoundingClientRect().height / w.innerHeight) };
    d.querySelector("#views > summary").click(); await settle(300);                // a tap on "Views" brings the view buttons back
    out.fullClose.opened = { assembled: onScreen("b-assembled"), reset: onScreen("b-reset"), more: (() => { const r = d.querySelector("#views .more summary").getBoundingClientRect(); return r.height > 0 && r.top >= 0 && r.bottom <= w.innerHeight; })(),
      scrollsDown: wrap.scrollHeight > wrap.clientHeight + 1, shareOfScreen: Math.round(100 * vw.getBoundingClientRect().height / w.innerHeight) };
    d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    if (d.fullscreenElement) await d.exitFullscreen();
    await settle(500);
    out.fullClosed = !wrap.classList.contains("v-overlay") && !d.fullscreenElement && d.getElementById("b-full").textContent === "Full screen";
    press("b-full"); await settle(600); d.getElementById("b-fullclose").click(); await settle(400);
    if (d.fullscreenElement) await d.exitFullscreen();
    out.fullClosedByTopButton = !wrap.classList.contains("v-overlay") && !d.fullscreenElement && d.getElementById("b-full").textContent === "Full screen";
    out.viewsBackAfterFull = d.getElementById("views").open === true && onScreenOrBelow("b-assembled");

    // ---- Rounds 3 and 4 (24 Nov 2026): the drone guide's look, orange highlight, tap to name, Play per step ----
    out.tone = w.__view().tone;                                                 // 1.05 = the drone guide's tone setting
    out.poster = !!d.querySelector("#p-model img");                             // no still picture first: the 3D is live straight away
    const playB = d.getElementById("b-play"), seekB = d.getElementById("v-seek");
    out.playOffAtStep0 = playB.disabled && d.getElementById("v-playnote").textContent === "Nothing moves in this step";
    for (let i = 0; i < 3; i++) next.click();                                   // step 3: the mic glows, the rest dims
    await settle(1500);
    const v3 = w.__view(); out.micGlow = v3.micGlow; out.micGlowPower = v3.micGlowPower; out.shelfOpacity = Math.round(v3.shelfOpacity * 100) / 100;
    const spot = w.__spot("mic__tube");
    w.__tap(spot.x, spot.y, 40); out.dragTag = w.__view().tag;                  // a drag is never a tap: no name appears
    w.__tap(spot.x, spot.y); out.tapTag = w.__view().tag;                       // a tap names the part and says how exact its drawing is
    w.__tap(r0.left + 3, r0.top + 3); out.tagGone = w.__view().tag === "";      // a tap on nothing puts the name away
    w.__point(spot.x, spot.y); out.pointTag = w.__view().tag;                   // the mouse resting on a part names it
    w.__point(r0.left + 3, r0.top + 3); out.pointGone = w.__view().tag === "";  // and the name goes when the mouse moves off
    for (let i = 0; i < 3; i++) next.click();                                   // step 6: Play puts the parts together
    await settle(1500);
    out.playTitle = d.getElementById("sp-title").textContent;
    const p0 = w.__view(); out.playReady = !playB.disabled && p0.lidUp === 0 && p0.playDur > 5;
    playB.click(); await settle(1300);
    const p1 = w.__view(); wheel(-300); await settle(700);                      // zoom in while it plays
    const p2 = w.__view();
    out.play = { going: p1.playing && p2.playing, label: playB.textContent, lidUp: Math.round(p1.lidUp), t1: Math.round(p1.playT * 10) / 10, t2: Math.round(p2.playT * 10) / 10,
      zoomed: Math.round(p2.dist / p1.dist * 1000) / 1000, bar: Number(seekB.value) };
    playB.click(); await settle(200);
    const p3 = w.__view(); out.paused = !p3.playing && playB.textContent.indexOf("Play") >= 0;
    seekB.value = 1000; seekB.dispatchEvent(new w.Event("input", { bubbles: true })); await settle(200);
    out.playEndLid = w.__view().lidUp;                                          // the slider at its end: everything in place

    // ---- step 2: the slider's end is where playing ends, with the case open (audit of 24 Nov 2026, finding 9) ----
    for (let i = 0; i < 4; i++) d.getElementById("m-back").click();
    await settle(1500);
    const slide = async (v) => { seekB.value = v; seekB.dispatchEvent(new w.Event("input", { bubbles: true })); await settle(200); return Math.round(w.__view().lidUp); };
    out.step2 = { title: d.getElementById("sp-title").textContent, atRest: Math.round(w.__view().lidUp), sliderStart: await slide(0), sliderEnd: await slide(1000),
      openPressed: d.getElementById("b-exploded").getAttribute("aria-pressed") === "true" };
    for (let i = 0; i < 4; i++) next.click();

    // ---- step 11: Play must show something (audit of 24 Nov 2026, finding 4: with the case shut, nothing changed) ----
    for (let i = 0; i < 5; i++) next.click();
    await settle(1500);
    const until = async (cond, ms = 15000) => { const t0 = performance.now(); while (!cond() && performance.now() - t0 < ms) await settle(60); };
    const moved = (a, b) => { let n = 0; for (let i = 0; i < a.length; i += 4) if (Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]) > 24) n++; return n; };   // of 9216 points
    const drawn = async (n) => { for (let i = 0; i < n; i++) await new Promise((r) => w.requestAnimationFrame(r)); };
    // four pictures 2, 3 and 4 drawn frames apart (a fan with 7 blades can look the same after some turns, so one pair is not enough)
    const fanMoves = async () => { const a = w.__view().fanTurn, s = [shot()]; for (const n of [2, 3, 4]) { await drawn(n); s.push(shot()); } const b = w.__view();
      return { turned: Math.abs(b.fanTurn - a) > 0.2, points: Math.max(moved(s[0], s[1]), moved(s[1], s[2]), moved(s[2], s[3]), moved(s[0], s[3])), lit: b.lit, at: Math.round(b.playT * 10) / 10 }; };
    out.step11 = { title: d.getElementById("sp-title").textContent, seeInside: w.__view().seeInside };
    playB.click(); await until(() => w.__view().playT >= 1.4);                  // from 1.2 s to 3.4 s it is switched off
    out.step11.off = await fanMoves();
    await until(() => w.__view().playT >= 3.7 || !w.__view().playing);          // then it starts again
    out.step11.onAgain = await fanMoves();
    for (let i = 0; i < 11; i++) d.getElementById("m-back").click();
    await settle(600);
    out.labelsStored = w.localStorage.getItem("noise-logger-3d-labels");        // "1": Labels were switched on above, and that is kept
  }

  const seen = (el) => { const r = el.getBoundingClientRect(), cs = w.getComputedStyle(el); return r.width > 0 && r.height > 0 && cs.visibility !== "hidden" && cs.display !== "none"; };
  const inSentence = (a) => [...a.parentNode.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim().length > 1); // a link inside running text
  function measure() {
    const small = new Set(), taps = [];
    d.querySelectorAll("body *").forEach((el) => {
      if (!seen(el) || ![...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim())) return;
      const px = parseFloat(w.getComputedStyle(el).fontSize);
      if (px < 13) small.add(el.tagName.toLowerCase() + (el.className ? "." + el.className : "") + " " + px + "px");
    });
    d.querySelectorAll("a,button,summary,label,textarea").forEach((el) => {
      if (!seen(el) || (el.tagName === "A" && inSentence(el))) return;
      const r = el.getBoundingClientRect(), extra = el.classList.contains("vlabel") ? 16 : 0; // 3D labels have an invisible 8 px margin each side
      if (r.height + extra < 43.5 || r.width < 43.5) taps.push((el.textContent || "").trim().slice(0, 24) + " " + Math.round(r.width) + "x" + Math.round(r.height + extra));
    });
    return { sideways: d.documentElement.scrollWidth > w.innerWidth, small: [...small], taps };
  }
  // ---- the 3D is drawn only while its tab is open (audit of 24 Nov 2026, finding 5: it was drawn behind Home, Build and Buy too) ----
  const GL = w.WebGL2RenderingContext && w.WebGL2RenderingContext.prototype;
  if (GL && out.model === "yes") {
    const o1 = GL.drawElements, o2 = GL.drawArrays; let calls = 0;
    GL.drawElements = function (...a) { calls++; return o1.apply(this, a); }; GL.drawArrays = function (...a) { calls++; return o2.apply(this, a); };
    const count = async () => { calls = 0; await wait(700); for (let i = 0; i < 6; i++) await new Promise((r) => w.requestAnimationFrame(r)); return calls; };
    d.querySelector('.tabs [data-tab="model"]').click(); await wait(300); const shown = await count();
    d.querySelector('.tabs [data-tab="home"]').click(); await wait(300); const hidden = await count();
    d.querySelector('.tabs [data-tab="model"]').click(); await wait(300); const shownAgain = await count();
    GL.drawElements = o1; GL.drawArrays = o2;
    out.drawing = { on3D: shown, onHome: hidden, backOn3D: shownAgain };
  }

  for (const tab of ["home", "build", "buy", "model"]) {
    const b = d.querySelector('.tabs [data-tab="' + tab + '"]'); if (!b) { out.errors.push("no tab " + tab); continue; }
    b.click();
    d.querySelectorAll("#p-" + tab + " .step").forEach((s) => s.classList.add("open"));
    d.querySelectorAll("#p-" + tab + " details").forEach((x) => (x.open = true));
    if (tab === "build") {
      const imgs = [...d.querySelectorAll(".still img")]; imgs.forEach((i) => (i.loading = "eager"));
      for (let i = 0; i < 40 && !imgs.every((im) => im.complete); i++) await wait(150);
      out.pictures = imgs.filter((im) => im.complete && im.naturalWidth > 0).length;
      out.warnFirst = [...d.querySelectorAll(".step")].every((s) => { const wn = s.querySelector(".note.safety"), ol = s.querySelector("ol");
        return !wn || !ol || (wn.compareDocumentPosition(ol) & Node.DOCUMENT_POSITION_FOLLOWING) > 0; }); // a step's warning comes before its actions
    }
    await wait(300);
    out.tabs[tab] = measure();
  }

  // ---- the Labels choice survives a reload (they were switched on above) ----
  if (out.labelsStored === "1") {
    await new Promise((r) => { f.addEventListener("load", r, { once: true }); f.contentWindow.location.reload(); });
    const d2 = f.contentDocument, w2 = f.contentWindow;
    for (let i = 0; i < 120 && d2.body.dataset.modelLoaded !== "yes"; i++) await wait(200);
    out.labelsAfterReload = w2.__view ? w2.__view().labels : null;
    out.labelsButtonAfterReload = d2.getElementById("b-labels").getAttribute("aria-pressed");
    d2.getElementById("b-labels").click();                                      // off again, as a new visitor has it
    out.labelsBackOff = w2.localStorage.getItem("noise-logger-3d-labels");
  }

  // ---- the same page at PC width (the audit of 24 Nov 2026 found faults that only show on a wide screen) ----
  f.style.width = "1280px";
  const dp = f.contentDocument, wp = f.contentWindow;
  const settleP = async (ms) => { await wait(ms); for (let i = 0; i < 6; i++) await new Promise((r) => wp.requestAnimationFrame(r)); };
  for (let i = 0; i < 120 && dp.body.dataset.modelLoaded !== "yes"; i++) await wait(200);
  dp.querySelector('.side [data-tab="model"]').click(); await settleP(900);
  out.pc = { width: wp.innerWidth, viewerH: Math.round(dp.getElementById("viewer").getBoundingClientRect().height) };
  dp.getElementById("b-measure").click(); await settleP(1800);
  out.pc.measureMarks = marksInside(dp);
  dp.getElementById("b-measure").click(); await settleP(300);
  // Back / Next right under the model on a PC too (audit of 24 Nov 2026, finding 3): on screen together with the model, and it stays put
  const nextP = dp.getElementById("m-next"), place = () => { const r = nextP.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]; };
  const vP = dp.getElementById("viewer").getBoundingClientRect(), before = place(), stepBefore = parseInt(dp.getElementById("sp-title").textContent, 10);
  nextP.click(); await settleP(300); nextP.click(); await settleP(900);
  out.pc.stepRow = { shown: before[2] > 43 && before[3] > 43, withModel: vP.top >= 0 && before[1] >= vP.bottom && before[1] + before[3] <= wp.innerHeight,
    stays: JSON.stringify(place()) === JSON.stringify(before), moved: parseInt(dp.getElementById("sp-title").textContent, 10) - stepBefore,
    playRowTop: Math.round(dp.getElementById("b-play").getBoundingClientRect().top), at: before };
  dp.getElementById("m-back").click(); dp.getElementById("m-back").click(); await settleP(300);

  // ---- a slow connection (audit of 24 Nov 2026, finding 2): check_page.py holds the model file back N seconds for an address with slow=N ----
  f.style.width = "390px";
  await new Promise((r) => { f.addEventListener("load", r, { once: true }); f.src = "../index.html?slow=2#model"; });
  const ds = f.contentDocument;
  f.contentWindow.addEventListener("error", (e) => out.errors.push(String(e.message)));
  for (let i = 0; i < 50 && ds.body.dataset.viewerReady !== "yes"; i++) await wait(100);
  const sign = ds.getElementById("vload");
  out.slow = { modelThereTooSoon: ds.body.dataset.modelLoaded === "yes", loadingSign: sign && sign.getBoundingClientRect().height > 0 ? sign.textContent : "" };
  for (let i = 0; i < 3; i++) ds.getElementById("sp-next").click();           // Next, three times, before the model is there
  for (let i = 0; i < 150 && ds.body.dataset.modelLoaded !== "yes"; i++) await wait(100);
  await wait(400);
  out.slow.titleAfterModel = ds.getElementById("sp-title").textContent;         // still step 3, not back to step 0
  out.slow.loadingSignGone = !ds.getElementById("vload");
  await new Promise((r) => { f.addEventListener("load", r, { once: true }); f.src = "../index.html?slow=6#build"; });   // 6 s: the old code gave up waiting after 5
  const dw = f.contentDocument, ww = f.contentWindow;
  ww.addEventListener("error", (e) => out.errors.push(String(e.message)));
  dw.querySelector("#step-6 .watch").click();                                   // 'Watch it in 3D' before the model is there
  out.slow.watchPressedBeforeModel = dw.body.dataset.modelLoaded !== "yes";
  for (let i = 0; i < 150 && dw.body.dataset.modelLoaded !== "yes"; i++) await wait(100);
  await wait(900);
  out.slow.watchTitle = dw.getElementById("sp-title").textContent;
  out.slow.watchPlaying = !!ww.__view && (ww.__view().playing || ww.__view().playT > 0.2);

}
f.addEventListener("load", () => run().catch((e) => out.errors.push("selftest: " + e.message)).finally(() => {
  document.getElementById("selftest").textContent = JSON.stringify(out); document.title = "selftest done";
  fetch("/selftest-result", { method: "POST", body: JSON.stringify(out) }).catch(() => {}); }), { once: true });   // check_page.py is listening; opened by hand, read the text on the page
</script></body>
